# End-to-end catalog for first-class secrets (see README.md).
#
# `test/secrets/source` runs the reference connector under `connector/`. It is
# published the way a real task arrives at first-class secrets: a sops-wrapped
# configuration with no `secrets` stanza at all. On its first Open the connector
# sees that empty stanza, wraps the tokens it manages as a sibling secret, and
# calls `/task/update-config` with the plaintext configuration and the stanza
# below in the comment. The publication that follows restarts it, and the
# restarted session reports `source: sibling`.
#
# `test/secrets/probe` is a Python derivation over the events that capture
# writes. It keeps its own string-valued sibling secret and compares it against
# a plaintext expectation, so a derived document is itself the assertion.
captures:
  test/secrets/source:
    endpoint:
      connector:
        # A fictitious registry, and a `:local` tag so the agent doesn't pull.
        # Build and install it by hand; see README.md.
        image: registry.example/acme/source-secrets:local
        # PRE-MIGRATION, and in the clear only so this file is readable.
        # Publication seals it through config-encryption on the way in, so
        # what's stored is a sops envelope: exactly what a task published
        # years ago carries. Invented values throughout.
        config:
          credentials:
            client_id: acme-client-id
            client_secret: acme-client-secret
            # Always `gen-<n>`: the connector parses the generation out of it,
            # and every rotation mints the next one.
            access_token: gen-0
            refresh_token: refresh-0
          rotate_every: 30
          emit_every: 5
    # Deliberately absent. An empty stanza is the migration trigger, and the
    # connector replaces this whole file's `config` and writes the stanza:
    #
    #   secrets:
    #     test/connectors/registry.example/acme/source-secrets/oauth-client: /credentials
    #     test/secrets/oauth-tokens: /credentials
    #     test/secrets/rotate-every: /rotate_every
    #
    # Two of those merge at `/credentials` over non-overlapping properties --
    # the vendor's client id and secret, and this task's own tokens -- so the
    # order in which they apply cannot matter. The first is not a sibling of
    # this task at all: it is admitted by the image rule, because the image's
    # repository follows the reserved `connectors` component exactly.
    bindings:
      - resource:
          name: events
        target: test/secrets/events

collections:
  # Written by the capture, and the probe's source. Mirrors the connector's own
  # `DOCUMENT_SCHEMA`; nothing here is a credential.
  test/secrets/events:
    schema:
      type: object
      properties:
        ts: { type: string, format: date-time }
        # Parsed from the current access token. Monotonic, restarts included.
        generation: { type: integer }
        # Flips from `legacy` to `sibling` exactly once, at the migration.
        source: { type: string, enum: [legacy, sibling] }
        client_id_digest: { type: string }
        token_digest: { type: string }
      required: [ts, generation, source]
    key: [/ts]

  test/secrets/probe:
    schema:
      type: object
      properties:
        ts: { type: string, format: date-time }
        # Echoed from the source document, so one collection carries both
        # halves of the story: the capture's rotation and the probe's verdict.
        generation: { type: integer }
        source: { type: string }
        ok: { type: boolean }
        # Present only when the comparison failed, and never the secret itself:
        # a length and a digest are enough to tell "stale value" from
        # "unresolved" without printing a credential into a collection.
        # Nullable: the generated Pydantic Document always serializes the field.
        detail: { type: [string, "null"] }
      required: [ts, generation, source, ok]
    key: [/ts]

    derive:
      using:
        python:
          module: probe.py
          environment:
            # The plaintext half of the comparison. Rotating the secret means
            # updating this in the same publication.
            EXPECTED_TOKEN: s3cr3t-t0ken
      # A sibling of the task: `test/secrets/token` beside `test/secrets/probe`.
      # It merges as an RFC 7396 patch, so this adds one property to
      # `environment` and leaves EXPECTED_TOKEN alone. String-valued, where the
      # capture's `rotate-every` is number-valued and its credential secrets are
      # objects -- the catalog covers all three.
      secrets:
        test/secrets/token: /environment/ACTUAL_TOKEN
      shards:
        flags:
          # Secrets are resolved by the V2 connector start pipeline, which
          # collections and materializations reach only via this flag.
          # Publication rejects a stanza without it.
          enable-runtime-v2: "true"
          # Run the locally-built connector image, and skip the registry pull.
          derive-image-tag: local
      transforms:
        - name: fromEvents
          source: { name: test/secrets/events }
          shuffle: { key: [/ts] }
