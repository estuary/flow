# End-to-end catalog for first-class secrets (see README.md).
#
# Two sibling tasks under `test/secrets/`, each drawing on a sibling secret, and
# each asserting a different half of the chain:
#
# - `test/secrets/hello` is a capture whose plaintext `rate` is -1, which the
#   connector rejects outright. The sibling secret `test/secrets/rate` overrides
#   it, so the capture running *at all* proves the merge happened.
# - `test/secrets/probe` is a Python derivation which compares a plaintext
#   `EXPECTED_TOKEN` against an `ACTUAL_TOKEN` that exists only in the secret
#   `test/secrets/token`. It publishes the verdict, so a derived document
#   reporting `ok: true` is proof of set -> authorize -> decrypt -> merge.
#
# The capture also supplies the derivation's driver: published together, the
# greetings it captures into `pings` are what invoke the derivation's transform.
captures:
  test/secrets/hello:
    endpoint:
      connector:
        image: ghcr.io/estuary/source-hello-world:dev
        config:
          # Deliberately unusable: the connector requires a positive rate and
          # reports this value back verbatim when the merge doesn't happen
          # ("message rate must be positive (got -1.000000)"). Nothing in the
          # control plane validates an endpoint config against its connector's
          # schema -- the schema is consulted only to find plaintext secrets --
          # so -1 reaches the connector untouched.
          rate: -1
    # `rate` is a JSON number, so this secret cannot be the same entity as
    # `test/secrets/token`, whose value lands in a string-valued environment
    # map. Two secrets, one per type, both siblings of the task which uses them.
    secrets:
      /rate: test/secrets/rate
    # Captures default to the V2 runtime, so unlike the derivation below this
    # task needs no `enable-runtime-v2` flag to resolve secrets.
    bindings:
      - resource:
          name: greetings
          prefix: "Hello {}!"
        target: test/secrets/pings

collections:
  # Source of the probe, and the capture's target. `flowctl preview --fixture`
  # can stand in for the capture when previewing the derivation alone.
  test/secrets/pings:
    schema:
      type: object
      properties:
        ts: { type: string, format: date-time }
        message: { type: string }
      required: [ts, message]
    key: [/ts]

  test/secrets/probe:
    schema:
      type: object
      properties:
        ts: { type: string, format: date-time }
        # Echoed from the source document. Not part of the assertion, but it
        # makes a live read visibly capture-driven rather than fixture-driven.
        message: { type: string }
        ok: { type: boolean }
        # Present only when the comparison failed, and never the secret itself:
        # a length and a digest are enough to tell "stale value" from
        # "unresolved" without printing a credential into a collection.
        # Nullable: the generated Pydantic Document always serializes the field.
        detail: { type: [string, "null"] }
      required: [ts, message, ok]
    key: [/ts]

    derive:
      using:
        python:
          module: probe.py
          environment:
            # The plaintext half of the comparison. Rotating the secret means
            # updating this in the same publication.
            EXPECTED_TOKEN: s3cr3t-t0ken
      # The secret must be a sibling of the task: `test/secrets/token` beside
      # `test/secrets/probe`. It merges as an RFC 7396 patch, so this adds one
      # property to `environment` and leaves EXPECTED_TOKEN alone.
      secrets:
        /environment/ACTUAL_TOKEN: test/secrets/token
      shards:
        flags:
          # Secrets are resolved by the V2 connector start pipeline, which
          # collections and materializations reach only via this flag.
          # Publication rejects a stanza without it.
          enable-runtime-v2: "true"
          # Run the locally-built connector image, and skip the registry pull.
          derive-image-tag: local
      transforms:
        - name: fromPings
          source: { name: test/secrets/pings }
          shuffle: { key: [/ts] }
