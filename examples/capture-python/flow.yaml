# A capture implemented by a user-authored Python connector, written with the
# Estuary CDK. It's a multi-file reference: the capture's directory is named for
# the final component of its name (`source-hello/`), and its `__init__.py`
# exports the `Connector` which the platform runs. Its modules import one
# another relatively. `flowctl raw discover` wrote its bindings and collection
# from the connector's models.
captures:
  examples/source-hello:
    endpoint:
      python:
        files:
          - pyproject.toml
          - source-hello/__init__.py
          - source-hello/api.py
          - source-hello/models.py
          - source-hello/resources.py
        # Parsed by the connector's EndpointConfig model, which is generated
        # from `spec.configSchema`.
        config:
          greeting: Howdy
          count: 3
        # The connector's Spec. Its resource configuration is the default:
        # the CDK's `ResourceConfig`, of a `name` and an update `interval`.
        spec:
          configSchema:
            type: object
            properties:
              greeting:
                type: string
                title: Greeting
                description: Greeting of each captured document
                default: Hello
              count:
                type: integer
                title: Count
                description: Number of greetings to capture
                default: 10
                minimum: 0
    bindings:
      - resource:
          # Discover documents each binding's resource path.
          _meta:
            path: [greetings]
          interval: PT30S
          name: greetings
        target: examples/greetings
    shards:
      flags:
        # Run this checkout's capture-python image, which `ci:catalog-test`
        # builds as `:local`.
        builtin-image-tag: local

collections:
  examples/greetings:
    schema: greetings.schema.yaml
    key: [/id]
