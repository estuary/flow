[project]
name = "source-hello"
version = "0.1.0"
requires-python = ">=3.14,<4"
dependencies = [
    # TODO(before merge): this pins commit ecee9b6e of the unmerged
    # `johnny/cdk-lint-backlog` branch of estuary/connectors. Repin it to a
    # commit of `main` once that branch merges.
    "estuary-cdk @ https://github.com/estuary/connectors/archive/ecee9b6e74b930ee0acf167a3b51d821cbff2e85.tar.gz#subdirectory=estuary-cdk",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pyright]
typeCheckingMode = "standard"
# Types generated from the capture's declared `spec`.
extraPaths = ["flow_generated/python"]
