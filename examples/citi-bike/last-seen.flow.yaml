import:
  - rides.flow.yaml

collections:
  examples/citi-bike/last-seen:
    key: [/bike_id]
    schema:
      type: object
      properties:
        bike_id: { $ref: ride.schema.yaml#/properties/bike_id }
        last: { $ref: ride.schema.yaml#/$defs/terminus }
      required: [bike_id, last]

    derive:
      using:
        sqlite:
          migrations: []
      transforms:
        - name: locationFromRide
          source: { name: examples/citi-bike/rides }
          # Shuffle on bike, not `any`: this collection is keyed on the bike and
          # its `last` terminus is last-write-wins, so a bike's rides must reduce
          # in source order — which holds only for documents of one shuffle key.
          # `any` would shuffle on the source key (bike *and* ride start), and a
          # bike's rides could then reduce in either order.
          shuffle: { key: [/bike_id] }
          lambda: select $bike_id, $end as last;
