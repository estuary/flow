import:
  - rides-and-relocations.flow.yaml

collections:
  examples/citi-bike/stations:
    key: [/id]
    schema: station.schema.yaml
    projections:
      currentBikes: /stable/add

    derive:
      using:
        typescript:
          module: stations.flow.ts
      transforms:
        - name: ridesAndMoves
          source: examples/citi-bike/rides-and-relocations
          # Shuffle on bike, not `any`: a station's `stable` set is reduced from
          # ordered add / remove pairs of a *single* bike (its relocation-arrival
          # must reduce before its ride-departure), and only same-shuffle-key
          # documents are guaranteed to reduce in source order. Operations of
          # *different* bikes commute, because the set is keyed on the bike ID.
          shuffle: { key: [/bike_id] }
