[project]
name = "derive-patterns"
version = "0.1.0"
requires-python = ">=3.14,<4"
dependencies = [
    "estuary-cdk>=0.3.0.dev79",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pyright]
typeCheckingMode = "strict"
# Types generated from the derivations' collections.
extraPaths = ["flow_generated/python"]

[tool.pytest.ini_options]
# A task's directory needn't be an identifier (`source-acme/`), and its tests
# import its modules relatively, which only the `importlib` mode supports.
addopts = "--import-mode=importlib"
# As for pyright: the project root, and then the generated types.
pythonpath = [".", "flow_generated/python"]
