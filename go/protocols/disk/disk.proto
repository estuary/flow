syntax = "proto3";

package disk;

import "broker/protocol/protocol.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/estuary/flow/go/protocols/disk";
option (gogoproto.goproto_getters_all) = false;
option (gogoproto.marshaler_all) = true;
option (gogoproto.protosizer_all) = true;
option (gogoproto.unmarshaler_all) = true;

// Disk serves block devices whose durable state lives in Gazette journals.
service Disk {
  // Session serves one disk for the lifetime of its stream. Closing the
  // stream unmounts the filesystem and destroys the device.
  rpc Session(stream Request) returns (stream Response);
}

// Request carries exactly one field. Open must be the first request of a
// session, and is sent once.
message Request {
  oneof request {
    Open open = 1;
    Publish publish = 2;
    Commit commit = 3;
    // Replaces the session's broker endpoint and credential, and has no reply.
    // The daemon reads requests in order, so the client must send it well
    // before the credential expires.
    Broker broker = 4;
  }
}

// Response carries exactly one field. Every request has one reply, in order,
// except Broker which has none. The daemon sends nothing unsolicited.
message Response {
  oneof response {
    Opened opened = 1;
    Published published = 2;
    Committed committed = 3;
  }
}

// Open recovers or creates a disk and mounts its filesystem.
message Open {
  // Journal holding the disk's durable state. Required.
  //
  // The journal must already exist. The daemon never creates, converges, or
  // deletes one: the client creates it before it opens a disk, and owns its
  // specification from then on. An Open of a journal which is absent therefore
  // fails, because that journal was never provisioned or has been deleted, and
  // serving a fresh disk in either case would hide the mistake.
  //
  // The daemon does validate the specification it finds, and refuses one a disk
  // could not be recovered from. Fragments must use a compression codec the
  // daemon can decompress, since it reads the journal back to rebuild the disk.
  // Fragment retention must be unset, and `path_postfix_template` empty, since
  // both delete fragments by age and age cannot see the recovery floor. Flags
  // must leave the journal writable.
  string journal = 1 [(gogoproto.casttype) = "go.gazette.dev/core/broker/protocol.Journal"];
  // Logical size of the device in bytes, and a multiple of the daemon's fixed
  // 4096-byte block size. The image is sparse, so this is a capacity and not an
  // allocation. Blocks are indexed by uint32, capping it at 2^32 blocks.
  //
  // This is the one durable per-disk fact. It is fixed from the moment a disk
  // first publishes, and every later Open must present the same value.
  uint64 device_size = 2;
  // Brokers serving the journal. Required.
  Broker broker = 3;
  // Acknowledgements which the client committed but which may not have reached
  // the journal, as returned by Published. The daemon appends them verbatim
  // before it uses the journal, and Gazette de-duplicates by UUID.
  //
  // The disk has committed state if the journal holds an acknowledged delta, or
  // if an acknowledgement is recovered here.
  //
  // When set, the journal must hold content that replays. An empty journal
  // means committed state was deleted, a journal whose replay applies no
  // records means the same, and either way the Open fails.
  repeated bytes recovered_acks = 4;
  // Recovery floor the client last persisted, as returned by Opened and
  // Committed, or zero if it holds none. It seeks the replay which rebuilds the
  // disk, and nothing more: a floor which is absent or behind costs replay work
  // and cannot change what the replay produces.
  //
  // A client must only echo a value this daemon returned for this journal. A
  // floor ahead of the true one skips fragments the disk still needs, and the
  // loss is silent.
  fixed64 floor_hint = 5;
}

// Broker addresses and authorizes the Gazette brokers serving a disk's journal.
message Broker {
  // Address of a broker. Required.
  string endpoint = 1 [(gogoproto.casttype) = "go.gazette.dev/core/broker/protocol.Endpoint"];
  // Bearer token presented to the broker. If empty, the daemon attempts to
  // connect anonymously.
  string credential = 2;
}

message Opened {
  // Absolute path of the mounted filesystem.
  string mount_path = 1;
  // Recovery floor this Open derived, or zero if it derived nothing better than
  // `floor_hint`. A fresh disk derives none, and neither does a recovery whose
  // replayed range completed no horizon.
  //
  // A session records here a floor which an earlier session derived but could
  // not report, because the client which would have persisted it was gone.
  //
  // The client persists the greatest floor this daemon has returned for the
  // journal, across Opened and Committed alike, and hands it back as the next
  // Open's `floor_hint`. That store is best-effort: the floor is a seek and
  // never a filter, so losing one costs replay work and nothing else. It must
  // never run ahead of what the daemon returned.
  fixed64 floor = 2;
}

// Publish cuts a point-in-time boundary of the device and finishes publishing
// the delta before it.
//
// A session holds at most one uncommitted acknowledgement, so the client must
// Commit before it may Publish again.
message Publish {}

message Published {
  // Acknowledgement record which commits the published delta. It is serialized
  // but not appended: it becomes durable disk state only when the client
  // returns it in Commit. The client treats it as opaque and records it in the
  // same atomic commit as the state the delta is aligned with. That record
  // obliges a later session to repair the acknowledgement through Open's
  // `recovered_acks`.
  //
  // Empty when the transaction changed nothing. The client then has no disk
  // obligation and sends no Commit.
  bytes ack = 1;
}

// Commit appends an acknowledgement which the client has made durable.
message Commit {
  // Must byte-equal the `ack` of the corresponding Published.
  bytes ack = 1;
}

// Committed reports that the acknowledgement is appended and confirmed by the
// broker. The client may begin its next transaction.
message Committed {
  // Recovery floor this commit established, or zero if it established none.
  // It is nonzero only when the committed delta completed a recovery horizon,
  // which puts a copy of every allocated block at or after that floor.
  //
  // The client persists the greatest floor this daemon has returned, per
  // Opened. Fragments below a persisted floor are the client's to delete.
  fixed64 floor = 1;
}

// DiskRecord is the only message of a disk journal. Records use Gazette's fixed
// protobuf framing, and their UUID flags distinguish two kinds:
//
//   - A fence record is OUTSIDE_TXN. It carries `installs_epoch`, has no
//     chunks, and does not change disk contents.
//   - A delta is one or more CONTINUE_TXN records, committed by one ACK_TXN
//     record which itself has no chunks.
//
// Readers apply Gazette message sequencing: group by producer and clock, drop
// duplicate UUIDs, and apply only acknowledged deltas.
message DiskRecord {
  // Gazette message UUID, packing a producer, clock, and transaction flags. A
  // session uses one producer for all of its deltas. A replacement session uses
  // a new producer, and each fence uses a producer of its own.
  bytes uuid = 1;
  // Chunks published by this record, applied in journal order. They are neither
  // sorted nor unique, because a block written repeatedly appears once per
  // write. The last chunk covering a block wins.
  repeated Chunk chunks = 2;
  // Set on the first record of a delta which opens a recovery horizon. The
  // horizon's position is that record's offset, and a reader snapshots its
  // allocated blocks just before applying the record's chunks. The flag must be
  // on the first record, or earlier chunks would clear bits which a reader
  // starting at the horizon never saw.
  //
  // The horizon belongs to its delta. If the delta is not acknowledged, the
  // horizon does not exist.
  bool opens_horizon = 3;
  // Producer installed as the journal's writer epoch, set only on a fence
  // record. The fence is appended with a compare-and-swap of the journal's
  // `author` register, which excludes the previous writer. This producer writes
  // the session's later delta records.
  bytes installs_epoch = 4;
}

// Chunk mutates a contiguous range of device blocks.
message Chunk {
  // First block covered by this chunk.
  uint32 block = 1;

  oneof content {
    // Content beginning at `block`, covering
    // `max(1, ceil(len(data) / block_size))` blocks, all of which become
    // allocated.
    //
    // The writer trims trailing zeroes, so `data` may end within its last
    // block, and empty `data` is one allocated block of zeroes. Replay writes
    // `data` and must then zero the rest of the covered range, or an older
    // value would survive in that tail.
    bytes data = 2;
    // Count of blocks to deallocate, beginning at `block`. Replay hole-punches
    // the range. Discard and write-zeroes requests both encode this way,
    // because an unallocated block reads as zeroes.
    uint32 punch = 3;
  }
}
