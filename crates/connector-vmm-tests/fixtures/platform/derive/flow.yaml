# A derivation of a Python project which counts greetings in its connector
# state, so that a session which restarts continues its count.
import:
  - ../hello-world.flow.yaml

collections:
  acmeCo/vmm-python/counted:
    schema:
      type: object
      properties:
        ts: { type: string, format: date-time }
        count: { type: integer }
      required: [ts, count]
    key: [/ts]
    derive:
      using:
        python:
          files:
            - pyproject.toml
            - counted/__init__.py
      vmm: true
      egress:
        hosts: [example.org]
      shards:
        # Its connector logs each uv run at debug.
        logLevel: debug
        flags:
          enable-runtime-v2: "true"
          # This checkout's derive-python, which ci:connector-vmm-kvm builds.
          custom-image-tag: local
      transforms:
        - name: fromGreetings
          source: { name: acmeCo/vmm-python/greetings }
          shuffle: any
