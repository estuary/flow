[project]
name = "counted"
version = "0.1.0"
requires-python = ">=3.14,<4"
dependencies = [
    "estuary-cdk>=0.3.0.dev79",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pyright]
typeCheckingMode = "standard"
# Types generated from the derivation's collections.
extraPaths = ["flow_generated/python"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = [".", "flow_generated/python"]
