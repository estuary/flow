[project]
name = "PROJECT_NAME"
version = "0.1.0"
requires-python = ">=3.14,<4"
dependencies = [
    "CDK_DEPENDENCY",
    "pydantic>=2",
]

[dependency-groups]
# Pyright and pytest are required: on each Validate, pyright type-checks
# the project and then pytest runs its tests.
dev = ["pyright>=1.1", "pytest>=8"]

[tool.uv]
package = false
# Packages uploaded within the past day aren't candidates for resolution.
# A malicious upload has time to be yanked, and an upstream security fix
# still arrives within a day.
exclude-newer = "1 day"

[tool.pyright]
typeCheckingMode = "strict"
# Types generated from the task's declared `spec`, and a derivation's collections.
extraPaths = ["flow_generated/python"]

[tool.pytest.ini_options]
# A task's directory needn't be an identifier (`source-acme/`), and its tests
# import its modules relatively, which only the `importlib` mode supports.
addopts = "--import-mode=importlib"
# As for pyright: the project root, and then the generated types.
pythonpath = [".", "flow_generated/python"]
