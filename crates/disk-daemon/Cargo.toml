[package]
name = "disk-daemon"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "flow-disk-daemon"
path = "src/bin/daemon.rs"

# The device and owner tests drive this binary through `sudo -n`, exercising a
# disk without a session around it.
[[bin]]
name = "disk-daemon-scenario"
path = "src/bin/scenario.rs"

[dependencies]
gazette = { path = "../gazette" }
proto-flow = { path = "../proto-flow" }
proto-gazette = { path = "../proto-gazette" }
proto-grpc = { path = "../proto-grpc", features = ["broker_client", "disk_client", "disk_server"] }
service-kit = { path = "../service-kit" }
tokens = { path = "../tokens" }

anyhow = { workspace = true }
async-process = { path = "../async-process" }
bytes = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
io-uring = { workspace = true }
libc = { workspace = true }
metrics = { workspace = true }
pbjson-types = { workspace = true }
prost = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[build-dependencies]
bindgen = { workspace = true }

[dev-dependencies]
async-process = { path = "../async-process" }
e2e-support = { path = "../e2e-support" }

insta = { workspace = true }
quickcheck = { workspace = true }
tempfile = { workspace = true }
