[package]
name = "disk-daemon"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

# The privileged tests drive this binary through `sudo -n` rather than running
# cargo as root. From Phase 4 it is replaced by `flow-disk-daemon` itself.
[[bin]]
name = "disk-daemon-scenario"
path = "src/bin/scenario.rs"

[dependencies]
gazette = { path = "../gazette" }
proto-flow = { path = "../proto-flow" }
proto-gazette = { path = "../proto-gazette" }
proto-grpc = { path = "../proto-grpc", features = ["broker_client"] }
tokens = { path = "../tokens" }

anyhow = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
io-uring = { workspace = true }
libc = { workspace = true }
pbjson-types = { workspace = true }
prost = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[build-dependencies]
bindgen = { workspace = true }

[dev-dependencies]
e2e-support = { path = "../e2e-support" }

insta = { workspace = true }
quickcheck = { workspace = true }
tempfile = { workspace = true }
