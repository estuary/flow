test://example/catalog.yaml:
  captures:
    first/capture:
      endpoint:
        connector:
          image: an/image
          config:
            bucket: foobar
            prefix: path/prefix
      # Use default interval.
      bindings:
        - target: a/collection
          resource: { stream: "contents" }
        - target: other/collection
          resource: { extra: "stuff" }
          backfill: 1

    capture/second:
      endpoint:
        connector:
          image: another/image
          config: referenced/config.yaml
      interval: 3m
      bindings:
        - target: third/collection
          resource: referenced/resource.yaml
      shards:
        maxTxnDuration: 30s
        logLevel: debug
      expectPubId: "00:11:22:33:44:55:66:77"

    capture/config-missing:
      endpoint:
        connector:
          image: another/image
          config: config/not/found.yaml
      bindings:
        - target: some/collection
          resource: resource/not/found.yaml
          backfill: 2

    capture/config-raw:
      endpoint:
        connector:
          image: another/image
          config: raw-config.foo
      bindings: []

    acmeCo/source-acme:
      endpoint:
        python:
          files:
            - pyproject.toml
            - source_acme/__init__.py
            - source_acme/__main__.py
            - source_acme/missing.py
          config:
            credentials:
              client_id: a-client-id
          # Spec schemas are inline or imported, and are bundled.
          spec:
            configSchema: source-acme.config.schema.yaml
            resourceConfigSchema:
              type: object
              properties:
                name: { type: string, x-collection-name: true }
              required: [name]
            oauth2:
              provider: acme
              authUrlTemplate: "https://acme.example/authorize?client_id={{{ client_id }}}"
              accessTokenUrlTemplate: https://acme.example/token
              accessTokenResponseMap:
                access_token: /access_token
      secrets:
        acmeCo/source-acme/client-secret: /credentials/client_secret
      bindings:
        - target: a/collection
          resource: { name: widgets }

    capture/local:
      endpoint:
        local:
          command: [do-the-thing, --arg=one, --arg, two]
          config:
            some: local config
      bindings: []

  materializations:
    a/materialization:
      sourceCapture: a/capture
      endpoint:
        connector:
          image: materialization/image
          config:
            its: config
      bindings:
        # No partition selector and default fields behavior.
        - source: source/collection
          resource: { table: "table_one" }
        # Explicit selector and fields.
        - source:
            name: other/source/collection
            partitions:
              include: { "a_field": ["some-val"] }
              exclude: { "other": [42] }
          resource: { table: "table_two" }
          fields:
            require:
              add: {}
            exclude: [del]
            recommended: true
      expectPubId: "00:11:22:33:44:55:66:77"

    materialization/with-config:
      endpoint:
        connector:
          image: materialization/another:image
          config: referenced/config.yaml
      bindings:
        - source: some/source/collection
          resource: referenced/resource.yaml
          backfill: 3

    materialization/with-config-fragment:
      endpoint:
        connector:
          image: materialization/another:image
          config: referenced/config.yaml#/bad/fragment
      bindings: []

    materialization/missing-config:
      endpoint:
        connector:
          image: materialization/image
          config: config/not/found.yaml
      bindings:
        - source: other/source/collection
          resource: referenced/not/found.yaml

    materialization/local:
      endpoint:
        local:
          command: [do-the-thing, --arg=one, --arg, two]
          config:
            some: local config
      bindings:
        - source: final/source/collection
          resource: { table: "table_three" }
      shards:
        ringBufferSize: 12345

test://example/referenced/config.yaml:
  referenced: config that's fairly long and does not inline

test://example/referenced/resource.yaml:
  referenced: resource that's fairly long and does not inline

test://example/raw-config.foo: |
  fn main() {
    do_the_thing();
    do_another_really_long_thing_that_does_stuff_boy_this_is_running_on_huh()?;
  }

test://example/source-acme.config.schema.yaml:
  type: object
  properties:
    credentials:
      $ref: credentials.schema.yaml
  required: [credentials]

test://example/credentials.schema.yaml:
  type: object
  properties:
    client_id: { type: string }
    client_secret: { type: string, secret: true }

test://example/pyproject.toml: |
  [project]
  name = "source-acme"
  dependencies = ["estuary-cdk"]

test://example/source_acme/__init__.py: |
  from estuary_cdk.capture import BaseCaptureConnector

test://example/source_acme/__main__.py: |
  import asyncio
  import source_acme

  asyncio.run(source_acme.Connector().serve())
