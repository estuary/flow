# Example catalog of the lab's three reference tasks.
#
# The materialization and derivation read Estuary's public demo collection
# `demo/wikipedia/recentchange`. `notBefore` bounds the backfill each run
# reads. Keep it inside the collection's actual retention, as a fragment
# removed between a listing and its read can fail the run, a ~5m widow.
#
# The capture is of a fake Postgres database (no database is involved), of the
# connector's canned tables. Its collections are as `flowctl raw discover`
# discovers them, but uncompressed (as broker compression is out of scope).

materializations:
  acmeCo/lab/sink:
    endpoint:
      local:
        command: ["materialize-sink"]
        protobuf: true
        config: {}
    shards:
      maxTxnDuration: 10s
    bindings:
      - source:
          name: demo/wikipedia/recentchange
          notBefore: 2026-09-27T00:00:00Z
        resource:
          table: recentchange

collections:
  acmeCo/lab/public/customers:
    schema: pg/customers.schema.yaml
    key: [/id]
    journals: { fragments: { compressionCodec: NONE } }
  acmeCo/lab/public/orders:
    schema: pg/orders.schema.yaml
    key: [/customer_id, /order_id]
    journals: { fragments: { compressionCodec: NONE } }
  acmeCo/lab/public/events:
    schema: pg/events.schema.yaml
    key: [/id]
    journals: { fragments: { compressionCodec: NONE } }

  acmeCo/lab/identity:
    schema:
      type: object
      properties:
        _meta:
          type: object
          properties:
            file: { type: string }
            offset: { type: integer }
          required: [file, offset]
      required: [_meta]
    key: [/_meta/file, /_meta/offset]
    derive:
      using:
        local:
          command: ["derive-identity"]
          protobuf: true
          config: {}
      shards:
        maxTxnDuration: 10s
      transforms:
        - name: recentchange
          source:
            name: demo/wikipedia/recentchange
            notBefore: 2026-09-27T00:00:00Z
          shuffle: { key: [/_meta/file, /_meta/offset] }

captures:
  acmeCo/lab/pg:
    endpoint:
      local:
        command: ["capture-fake-postgres"]
        protobuf: true
        # Every knob, at its default. `tables` (unset) defaults to the canned
        # tables `public.customers`, `public.orders`, and `public.events`.
        config:
          seed: 0
          backfillChunkSize: 50000
          txnsPerChunk: 20
          changesPerTxn: 10
    bindings:
      - resource: { namespace: public, stream: customers }
        target: acmeCo/lab/public/customers
      - resource: { namespace: public, stream: orders }
        target: acmeCo/lab/public/orders
      - resource: { namespace: public, stream: events }
        target: acmeCo/lab/public/events
