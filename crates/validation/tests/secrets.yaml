# Base catalog of the `secrets` stanza scenarios: one task of each type, each
# drawing a sibling secret into an otherwise plaintext endpoint configuration,
# plus two captures which are exempt from the plaintext invariant. The base
# publishes cleanly; tests patch it to exercise the checks one at a time.
test://example/catalog.yaml:
  collections:
    acmeCo/widgets:
      schema:
        type: object
        properties:
          id: { type: integer }
        required: [id]
      key: [/id]

    acmeCo/rollups:
      schema:
        type: object
        properties:
          id: { type: integer }
        required: [id]
      key: [/id]
      derive:
        # Derivations opt into the V2 runtime, which resolves secrets.
        using:
          connector:
            image: derive/image
            config:
              address: derive.example.com
        secrets:
          /credentials/token: acmeCo/api-token
        transforms:
          - name: fromWidgets
            source: acmeCo/widgets
            shuffle: any
        shards:
          flags:
            enable-runtime-v2: "true"

  captures:
    # Captures run V2 unless pinned false, so this one carries no flag.
    acmeCo/source-widgets:
      endpoint:
        connector:
          image: source/image
          config:
            address: db.example.com
      secrets:
        /credentials: acmeCo/db-credentials
      bindings:
        - resource: { stream: widgets }
          target: acmeCo/widgets

    # A disabled task validates against the no-op connector, whose permissive
    # schema has no `secret` annotations, so its plaintext password passes.
    # Every model-only check still applies.
    acmeCo/source-disabled:
      endpoint:
        connector:
          image: source/image
          config:
            credentials: { password: hunter2 }
      secrets:
        /credentials/token: acmeCo/api-token
      bindings:
        - resource: { stream: widgets }
          target: acmeCo/widgets
      shards:
        disable: true

    # Without a stanza, a plaintext (or in-place sops-encrypted) value at an
    # annotated location is allowed, as every pre-existing task has one.
    acmeCo/source-legacy:
      endpoint:
        connector:
          image: source/image
          config:
            credentials: { user: alice, password: hunter2 }
      bindings:
        - resource: { stream: widgets }
          target: acmeCo/widgets

  materializations:
    acmeCo/dest-widgets:
      endpoint:
        connector:
          image: dest/image
          config:
            address: warehouse.example.com
      secrets:
        /credentials/password: acmeCo/warehouse-password
      bindings:
        - resource: { table: widgets }
          source: acmeCo/widgets
      shards:
        flags:
          enable-runtime-v2: "true"

driver:
  dataPlanes:
    "1d:1d:1d:1d:1d:1d:1d:1d": {}

  captures:
    acmeCo/source-widgets:
      connectorType: IMAGE
      config:
        image: source/image
        config:
          address: db.example.com
      configSchema: &connectorConfigSchema
        type: object
        properties:
          address: { type: string }
          tunnel: { type: object, secret: true }
          credentials:
            oneOf:
              - type: object
                properties:
                  user: { type: string }
                  password: { type: string, secret: true }
              - type: object
                properties:
                  user: { type: string }
                  token: { type: string, secret: true }
      bindings:
        - resourcePath: [widgets]

    acmeCo/source-legacy:
      connectorType: IMAGE
      config:
        image: source/image
        config:
          credentials: { user: alice, password: hunter2 }
      configSchema: *connectorConfigSchema
      bindings:
        - resourcePath: [widgets]

  derivations:
    acmeCo/rollups:
      connectorType: IMAGE
      config:
        image: derive/image
        config:
          address: derive.example.com
      configSchema: *connectorConfigSchema
      shuffleKeyTypes: []
      transforms:
        - readOnly: false
      generatedFiles: {}

  materializations:
    acmeCo/dest-widgets:
      connectorType: IMAGE
      config:
        image: dest/image
        config:
          address: warehouse.example.com
      configSchema: *connectorConfigSchema
      deltaUpdates: false
      bindings:
        - constraints:
            id: { type: 1, reason: "required" }
            flow_document: { type: 2, reason: "location required" }
          resourcePath: [widgets]
