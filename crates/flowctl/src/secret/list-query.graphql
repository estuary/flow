fragment SelectSecret on Secret {
    catalogName
    secretId
}

query ListSecrets($filter: SecretsFilter, $after: String, $first: Int) {
    secrets(filter: $filter, after: $after, first: $first) {
        pageInfo {
            hasNextPage
            endCursor
        }
        edges {
            node {
                ...SelectSecret
            }
        }
    }
}
