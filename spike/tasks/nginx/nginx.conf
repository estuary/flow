# Target for the egress probes: one 1 KiB body, reachable over plain HTTP and
# over TLS with the self-signed cert env-setup.sh generates next to this file.
server {
    listen      80  default_server;
    listen      443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/spike/cert.pem;
    ssl_certificate_key /etc/nginx/spike/key.pem;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
}
