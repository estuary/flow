[package]
name = "flow-sandbox-egress"
version = "0.0.0"
edition = "2021"
publish = false

# Its own workspace root: the spike is not a member of the repo's `crates/*`
# workspace and must not perturb the repo's lockfile.
[workspace]

[lib]
name = "flow_sandbox_egress"
path = "src/lib.rs"

[[bin]]
name = "flow-sandbox-egress"
path = "src/bin/egress.rs"

[[bin]]
name = "flow-sandbox-resolver"
path = "src/bin/resolver.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
