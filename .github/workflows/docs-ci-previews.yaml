# DEPRECATED. `site/` is the old docs location.
#
# Estuary's docs now live in two other repos:
#   - estuary/docs        platform docs: guides, concepts, reference
#   - estuary/connectors  connector pages, under docs/reference/Connectors/
#
# This workflow used to publish a PR preview to
# https://docs.estuary.dev/pr-preview/pr-N/. That host is now a Cloudflare
# Worker serving estuary/docs, which holds no pr-preview content, so every one
# of those URLs returns 404. The workflow was handing contributors a green check
# and a dead link, which reads as confirmation that a change shipped somewhere.
#
# What it does now:
#   - Builds `site/`. Kept on purpose: this is the only check that the gh-pages
#     rollback artifact still compiles. See docs-ci-prod.yaml.
#   - Tells the PR author that `site/` is deprecated and where to send the
#     change instead.
#
# The removed `Compute changed pages` step is not lost, and is worth recovering
# if PR previews are ever rebuilt. It resolved each changed file to its
# Docusaurus URL, handling frontmatter slugs, relative slug resolution against
# the file's directory, and the category-index convention where
# PostgreSQL/PostgreSQL.md serves at /PostgreSQL/ rather than
# /PostgreSQL/PostgreSQL/. A naive path-to-URL version of this is wrong. Get it
# from git history rather than rewriting it:
#   git log -p --follow -- .github/workflows/docs-ci-previews.yaml
#
# Removal target: 2026-09-30, tentative, together with site/ and
# docs-ci-prod.yaml. The date moves if the site has an incident that needs the
# rollback, or if the open `site/` PR backlog has not cleared. It does not move
# for convenience.
name: "DEPRECATED site/: build check and redirect notice"

on:
  pull_request:
    paths:
      - site/**
    types:
      - opened
      - reopened
      - synchronize

concurrency: preview-${{ github.ref }}

permissions:
  contents: read
  pull-requests: write

jobs:
  # Job id is the check name contributors see on the PR. "deploy-preview" was
  # both wrong and reassuring, which was the problem.
  deprecated-site-build-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./site/package-lock.json
      - name: Install dependencies
        working-directory: ./site
        run: npm ci
      - name: Build `docs.estuary.dev`
        working-directory: ./site
        run: npm run build
      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ### `site/` is the deprecated docs location

            This PR touches `site/`, which is no longer the source for
            `docs.estuary.dev`. The site is now built from two other repos:

            - [estuary/docs](https://github.com/estuary/docs) for platform docs:
              guides, concepts, reference, getting started.
            - [estuary/connectors](https://github.com/estuary/connectors) for
              connector pages, under `docs/reference/Connectors/`.

            If you meant to change the docs, the change will not reach the site
            from here. Please move it to whichever of those two repos owns the
            page.

            If this is a code PR that happens to include a doc file, the code
            part is fine and this notice does not block it. Move the doc edit to
            the repo above, or drop it from this PR.

            There are no PR previews for `site/` any more. The old
            `docs.estuary.dev/pr-preview/pr-N/` links all return 404.

            `site/` is kept until 2026-09-30 (tentative) so it can serve as a
            rollback path for the new site, then it is removed. The build check
            on this PR only confirms that rollback target still compiles.
