name: Dekaf Test
permissions:
    contents: read

# DEMO ONLY (this PR is not for merge): `label-deploy-scope` is added to the
# branch filter and a labeler job is piggybacked below, because a
# `pull_request_target` workflow cannot trigger until its file reaches the
# default branch. The `pull_request` event runs this PR's own version of the
# workflow, which is what lets the demo fire pre-merge.
on:
    pull_request:
        branches: [master, label-deploy-scope]
        paths-ignore:
            - "site/**"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    SCCACHE_VERSION: v0.12.0

jobs:
    label-deploy-scope-demo:
        name: agent-api label (demo)
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            pull-requests: write
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            LABEL: "deploy:agent-api"
            PR: ${{ github.event.pull_request.number }}
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false
            - name: Collect changed files
              run: |
                  gh api --paginate \
                    "repos/${{ github.repository }}/pulls/${PR}/files" \
                    --jq '.[].filename' > changed.txt
                  wc -l < changed.txt
            - name: Classify
              id: classify
              run: |
                  set +e
                  python3 .github/scripts/deploy_scope.py --files changed.txt --target agent
                  status=$?
                  set -e
                  if [ "$status" -gt 1 ]; then exit "$status"; fi
                  echo "ships=$([ "$status" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            - name: Ensure label exists
              run: |
                  gh label create "$LABEL" \
                    --repo "${{ github.repository }}" \
                    --color 1D76DB \
                    --description "Reaches production via the Deploy agent-api workflow" \
                    || true
            - name: Apply or remove label
              run: |
                  if [ "${{ steps.classify.outputs.ships }}" = "true" ]; then
                    gh pr edit "$PR" --repo "${{ github.repository }}" --add-label "$LABEL"
                  else
                    gh pr edit "$PR" --repo "${{ github.repository }}" --remove-label "$LABEL" || true
                  fi

    dekaf-test:
        name: Dekaf Test
        # DEMO ONLY: skip the heavy e2e job for the demo PR's non-master base.
        if: github.base_ref == 'master'
        runs-on: ubuntu-2404-large
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: true # Official JSON test data.
                  lfs: true # Test fixtures.

            - name: Install build tools
              uses: jdx/mise-action@9dc7d5dd454262207dea3ab5a06a3df6afc8ff26 # v3.4.1
            - run: rustup upgrade

            - name: Cache Rust workspace
              uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
              with:
                  # CI's single checkout registers as index 0 / `flow`, so the
                  # per-stack target dir is ../../../cargo-target/flow.
                  workspaces: ". -> ../../../cargo-target/flow"

            - name: Cache RocksDB
              uses: actions/cache@v4
              with:
                  key: rocksdb-${{ runner.os }}-${{ runner.arch }}-${{ env.ROCKSDB_VERSION }}
                  path: |
                      ~/rocksdb-${{ env.ROCKSDB_VERSION }}/include/
                      ~/rocksdb-${{ env.ROCKSDB_VERSION }}/lib/

            - name: Cache/Restore Go workspace.
              uses: actions/cache@v4
              with:
                  path: ~/go/pkg/mod
                  key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

            - uses: mozilla-actions/sccache-action@v0.0.9
              with:
                  version: ${{ env.SCCACHE_VERSION }}
            - run: echo 'SCCACHE_GHA_ENABLED=true' >> $GITHUB_ENV
            - run: echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> $GITHUB_ENV
            - run: mise run build:rocksdb
            - run: mise run ci:musl-dev
            - run: mise run ci:gnu-dev
            - run: mise run build:gazette
            - run: mise run build:flowctl-go
            - run: mise run local:stack --dekaf
            - run: mise run ci:dekaf-e2e

            # `ci:dekaf-e2e` dumps logs for the services a test failure implicates,
            # but a failure while bringing the stack up leaves no diagnostics at
            # all. Dump every unit's state and journal so those are debuggable
            # from the run alone.
            - name: Dump stack diagnostics
              if: failure()
              run: |
                  systemctl --user list-units --all --no-pager 'flow-*' || true
                  systemctl --user --failed --no-pager || true
                  journalctl --user -u 'flow-*' --no-pager -n 3000 -o short-precise || true
