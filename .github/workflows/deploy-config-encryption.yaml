name: Deploy config-encryption

on:
  workflow_run:
    workflows: ["Platform Build"]
    types:
      - completed
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0  # Required for git describe to find tags

      - name: Get image tag
        id: image-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="dev-next"
          else
            TAG=$(git describe --tags --always)
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "image=us-central1-docker.pkg.dev/estuary-control/ghcr/estuary/config-encryption:${TAG}" >> $GITHUB_OUTPUT

      - name: Authenticate with GCP Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          service_account: cd-github-actions@estuary-control.iam.gserviceaccount.com
          workload_identity_provider: projects/1084703453822/locations/global/workloadIdentityPools/github-actions/providers/github-actions-provider

      - name: Deploy Cloud Run service `config-encryption`
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: config-encryption
          project_id: estuary-control
          region: us-central1
          image: ${{ steps.image-tag.outputs.image }}

          # The service predates this workflow and was last deployed by hand in 2023 with
          # a since-removed CLI (`--log.format`, `--gcp-kms`). Clearing command/args hands
          # configuration back to the image ENTRYPOINT plus the env vars below; leaving the
          # stale args in place would make the container exit on unrecognized arguments.
          # The `config-encryption` runtime service account already holds
          # roles/cloudkms.cryptoKeyEncrypter on the legacy KMS key's project. On the
          # first-class secrets key (`platform-secrets`) it must hold *both* encrypt and
          # decrypt, because this service is the only holder of that decrypt grant: a
          # secret never travels inside a built spec, so no data-plane is ever granted it.
          #
          # `--port` must go here rather than in a `port:` input: deploy-cloudrun@v2 has no
          # such input and silently ignores one, which leaves the container port at Cloud
          # Run's 8080 default while the service listens on API_PORT, failing the startup
          # probe. API_PORT below is set to the same value so neither side is implicit.
          flags: >-
            --command=""
            --args=""
            --port=8765
            --service-account=config-encryption@estuary-control.iam.gserviceaccount.com

          # KMS_KEY wraps legacy endpoint configs and is unwrapped by data-plane reactors,
          # so it stays put. SECRETS_KMS_KEY wraps first-class secrets under a deliberately
          # separate keychain which only this service can unwrap; CONTROL_PLANE_URL is the
          # API it asks whether a `/secret/decrypt` caller may have the plaintext.
          env_vars: |-
            API_PORT=8765
            CONTROL_PLANE_URL=https://api.estuary.dev/
            KMS_TYPE=gcp
            KMS_KEY=projects/helpful-kingdom-273219/locations/us-central1/keyRings/catalog-sops/cryptoKeys/config-encryptor
            NO_COLOR=1
            RUST_LOG=info
            SECRETS_KMS_TYPE=gcp
            SECRETS_KMS_KEY=projects/estuary-control/locations/us-central1/keyRings/platform-secrets/cryptoKeys/platform-secrets_key

          env_vars_update_strategy: overwrite
