name: Platform
permissions:
  contents: read

on:
  # GitHub scopes a cache to the ref that wrote it, readable by that ref, its
  # descendants, and the default branch. These jobs run on master so pull
  # requests have a master-scoped entry to restore; without it they all start
  # cold. rust-cache keys on ${GITHUB_JOB}, so no other workflow warms them.
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled run saves no cache, and master runs exist to save one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCCACHE_VERSION: v0.12.0

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        uses: jdx/mise-action@9dc7d5dd454262207dea3ab5a06a3df6afc8ff26 # v3.4.1
      - run: rustup upgrade

      - run: mise run ci:format-check

  generated-artifacts-check:
    name: Generated Artifacts Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        uses: jdx/mise-action@9dc7d5dd454262207dea3ab5a06a3df6afc8ff26 # v3.4.1
      - run: rustup upgrade

      - run: mise run local:supabase --no-block

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: ". -> ../../../cargo-target/flow"
          # Restore on every run, save only from master. The key ends in a hash
          # of Cargo.lock and the Cargo.tomls, so a pull request that leaves
          # dependencies alone computes the key master already holds; its save is
          # a private copy whose only effect is to evict the shared entry. One
          # that does change them restores master's through the restore-key
          # prefix and rebuilds just what changed.
          save-if: ${{ github.ref == 'refs/heads/master' }}
          # rust-cache saves only on success by default, and master's is now the
          # only entry -- a failing master run would leave pull requests cold.
          cache-on-failure: true

      - name: Cache RocksDB
        uses: actions/cache@v4
        with:
          key: rocksdb-${{ runner.os }}-${{ runner.arch }}-${{ env.ROCKSDB_VERSION }}
          path: |
            ~/rocksdb-${{ env.ROCKSDB_VERSION }}/include/
            ~/rocksdb-${{ env.ROCKSDB_VERSION }}/lib/

      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: ${{ env.SCCACHE_VERSION }}
      - run: echo 'SCCACHE_GHA_ENABLED=true' >> $GITHUB_ENV
      - run: echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> $GITHUB_ENV

      - name: Cache sqlx-cli
        id: cache-sqlx
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-${{ runner.os }}-${{ runner.arch }}-0.9.0

      - name: Install sqlx-cli
        if: steps.cache-sqlx.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli@0.9.0 --no-default-features --features postgres

      - run: mise run build:rocksdb
      - run: mise run local:supabase
      - run: mise run ci:sqlx-check

  # Report a check on every PR; build the image only for relevant changes.
  connector-vmm-gate:
    name: Connector VMM Image Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The pull request's merge commit, which actions/checkout checks out.
      EXPECTED_COMMIT: ${{ github.sha }}
      # This run's gate container, which the backstop below removes by name.
      CONNECTOR_VMM_GATE_NAME: connector-vmm-gate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # The merge commit's first parent is the base it merges into, so the
      # diff between them is the pull request's whole change. The crates are
      # those connector-vmm and guest-init build from, by path dependency.
      - name: Find changes the gate covers
        id: changes
        # -o pipefail, so that a failed git or cargo fails the step rather
        # than finding nothing.
        shell: bash
        run: |
          [ "$(git rev-parse HEAD)" = "${EXPECTED_COMMIT}" ] && git rev-parse --verify --quiet HEAD^2 >/dev/null \
            || { echo "HEAD is not the pull request's merge commit ${EXPECTED_COMMIT}" >&2; exit 1; }
          CRATES=$(cargo metadata --no-deps --offline --format-version 1 | jq -r --arg root "${PWD}/" '
            (.packages | map({key: (.manifest_path | rtrimstr("/Cargo.toml")),
              value: [.dependencies[] | select(.path != null and .kind != "dev") | .path]}) | from_entries) as $deps
            | def closure: . as $set | ([$set[], ($set[] | $deps[.][])] | unique) | if . == $set then . else closure end;
            [.packages[] | select(.name == "connector-vmm" or .name == "guest-init") | .manifest_path | rtrimstr("/Cargo.toml")]
            | closure | .[] | ltrimstr($root) + "/"')
          [ -n "${CRATES}" ] || { echo "found no crates for connector-vmm and guest-init" >&2; exit 1; }
          PREFIXES=(${CRATES}
            Cargo.toml Cargo.lock mise.toml docker/connector-vmm.Dockerfile
            mise/tasks/build/identity-lib.sh mise/tasks/local/stack-env
            mise/tasks/ci/connector-vmm-candidate mise/tasks/ci/connector-vmm-gate
            mise/tasks/ci/docker-images mise/tasks/ci/package
            .github/workflows/platform-build.yaml .github/workflows/platform-test.yaml)
          RELEVANT=$(git diff --name-only HEAD^1 HEAD | while read -r path; do
            for prefix in "${PREFIXES[@]}"; do
              if [[ "${path}" == "${prefix}" || ("${prefix}" == */ && "${path}" == "${prefix}"*) ]]; then
                echo "${path}"
                break
              fi
            done
          done)
          if [ -n "${RELEVANT}" ]; then
            printf 'Gating, for:\n%s\n' "${RELEVANT}"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing this pull request changes is covered by the gate: ${PREFIXES[*]}"
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tools
        if: steps.changes.outputs.relevant == 'true'
        uses: jdx/mise-action@9dc7d5dd454262207dea3ab5a06a3df6afc8ff26 # v3.4.1
      - if: steps.changes.outputs.relevant == 'true'
        run: rustup upgrade

      - if: steps.changes.outputs.relevant == 'true'
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: ${{ env.SCCACHE_VERSION }}
      - if: steps.changes.outputs.relevant == 'true'
        run: |
          echo 'SCCACHE_GHA_ENABLED=true' >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> $GITHUB_ENV

      - name: Build and gate the VMM image
        if: steps.changes.outputs.relevant == 'true'
        timeout-minutes: 45
        run: mise run ci:connector-vmm-candidate --dir "${RUNNER_TEMP}/connector-vmm-candidate"

      # Backstop for a gate stopped before its own cleanup ran: this run's
      # container alone, by its exact name.
      - name: Remove this run's gate container
        if: always() && steps.changes.outputs.relevant == 'true'
        run: |
          NAMES=$(docker ps -a --filter "name=${CONNECTOR_VMM_GATE_NAME}" --format '{{.Names}}')
          if grep -qxF -- "${CONNECTOR_VMM_GATE_NAME}" <<<"${NAMES}"; then
            docker rm -f "${CONNECTOR_VMM_GATE_NAME}"
          fi

      - name: Upload the candidate's logs and report
        if: (failure() || cancelled()) && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: connector-vmm-candidate
          path: |
            ${{ runner.temp }}/connector-vmm-candidate/report
            ${{ runner.temp }}/connector-vmm-candidate/*.log
            ${{ runner.temp }}/connector-vmm-candidate/metadata.json
          if-no-files-found: warn

  platform-test:
    name: Platform Test
    runs-on: ubuntu-2404-large
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true # Official JSON test data.
          lfs: true # Test fixtures.

      - name: Install build tools
        uses: jdx/mise-action@9dc7d5dd454262207dea3ab5a06a3df6afc8ff26 # v3.4.1
      - run: rustup upgrade

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: ". -> ../../../cargo-target/flow"
          # See the note on the job above.
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true

      - name: Cache RocksDB
        uses: actions/cache@v4
        with:
          key: rocksdb-${{ runner.os }}-${{ runner.arch }}-${{ env.ROCKSDB_VERSION }}
          path: |
            ~/rocksdb-${{ env.ROCKSDB_VERSION }}/include/
            ~/rocksdb-${{ env.ROCKSDB_VERSION }}/lib/

      - name: Cache/Restore Go workspace.
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: ${{ env.SCCACHE_VERSION }}
      - run: echo 'SCCACHE_GHA_ENABLED=true' >> $GITHUB_ENV
      - run: echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> $GITHUB_ENV

      # These steps are kept in lockstep with task `ci:platform-test`
      # (formating and SQLx checks are run in separate jobs above to provide faster feedback).
      - run: mise run local:supabase --no-block
      - run: mise run build:rocksdb
      - run: mise run ci:musl-dev
      - run: mise run ci:wasm-test --browser
      - run: mise run local:supabase
      - run: mise run ci:sql-tap
      - run: mise run ci:gnu-dev
      - run: mise run build:gazette
      - run: mise run build:flowctl-go
      - run: mise run ci:nextest-build
      - run: mise run local:bigtable
      - run: mise run ci:nextest-run

      - run: mise run ci:doctest
      - run: mise run ci:gotest
      - run: mise run ci:catalog-test
      - run: mise run ci:flow-schema-check

      # Run last so its flakiness can't skip the test steps above. It still gates
      # the job on failure, surfacing genuine Stripe regressions.
      - name: Stripe integration test
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_TESTMODE_API_KEY }}
        if: env.STRIPE_API_KEY != ''
        # Run via `mise exec` so the ambient stack env (FLOW_PG_URL for the DB,
        # CARGO_TARGET_DIR for --frozen binaries) is present; the agent
        # integration tests read FLOW_PG_URL at runtime.
        run: mise exec -- cargo nextest run --frozen --run-ignored ignored-only -E 'test(graphql_billing_live_stripe)'
